[project]
name = "career-platform"
version = "0.1.0"
description = "Personal job-search assistant for the Saudi market — WhatsApp + Salla. Commercial product governed by docs/WHITEPAPER.html."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

# Runtime stack is locked by CLAUDE.md / whitepaper §15:
# Python 3.11+ · FastAPI · PostgreSQL 16 (+RLS) · Redis · SQLAlchemy + Alembic · Docker Compose · pytest.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # CV upload security pipeline (C5.5): PDF inspection/sanitization/text,
    # and entity-expansion-safe XML for untrusted DOCX parts.
    "pypdf>=4.2",
    "defusedxml>=0.7",
    # CV extraction via Claude (C5.6) — the only LLM provider (D1).
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
# Tests use assert, hardcoded fake secrets, and build SQL from fixed table names.
"tests/*" = ["S101", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["career", "career_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
