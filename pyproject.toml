[project]
name = "career-platform"
version = "0.1.0"
description = "Personal job-search assistant for the Saudi market — WhatsApp + Salla. Commercial product governed by docs/WHITEPAPER.html."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

# Runtime stack is locked by CLAUDE.md / whitepaper §15:
# Python 3.11+ · FastAPI · PostgreSQL 16 (+RLS) · Redis · SQLAlchemy + Alembic · Docker Compose · pytest.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # CV upload security pipeline (C5.5): PDF inspection/sanitization/text,
    # and entity-expansion-safe XML for untrusted DOCX parts.
    "pypdf>=4.2",
    "defusedxml>=0.7",
    # CV extraction via Claude (C5.6) — the only LLM provider (D1).
    "anthropic>=0.40",
    # CV rendering (C7.1): v5 template via Jinja (autoescape) + WeasyPrint;
    # EmailStr needs the email extra. System deps: libpango + Liberation/DejaVu
    # fonts (pinned in the Docker image / host for deterministic layout).
    "jinja2>=3.1",
    "weasyprint>=62",
    "email-validator>=2.0",
    # WhatsApp Cloud API transport (C4 live): JSON + multipart media uploads.
    "requests>=2.31",
]

[project.optional-dependencies]
# Discovery engine extra (C6): jobspy is optional by design — the adapter
# degrades to [] without it (§5.3). Installed on the nightly-runner host.
engine = [
    "python-jobspy>=1.1.80",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
# Tests use assert, hardcoded fake secrets, and build SQL from fixed table names.
"tests/*" = ["S101", "S105", "S106", "S608"]
# Machine-extracted byte-verbatim constants (the LEGACY §1.2 template,
# §10.1–10.3 prompts) — one line each by construction; must not be reflowed.
"src/career/cv/template.py" = ["E501"]
"src/career/cv/prompts.py" = ["E501"]
# Live probes: fixed systemctl arg-lists and fixed https URLs only — the
# operator console reads liveness facts, no untrusted input reaches either.
"scripts/run_admin_bot.py" = ["S310", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["career", "career_core"]

[[tool.mypy.overrides]]
# WeasyPrint ships no type stubs; its call sites are wrapped in our own typed
# functions (render_cv_pdf, funnel report.render_report_pdf). The letter
# renderer that used to be one of them is gone — DEVIATIONS D23.
module = "weasyprint.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Two gates, one suite. `scripts/gate.sh` answers «is this code safe to push»
# from repository truth and `scripts/gate.sh --host` (which
# scripts/deploy_preflight.sh requires) answers «is THIS MACHINE running it».
# Conflating them is what makes an honest host check get deleted: on
# 2026-08-06 host drift would otherwise have blocked every commit until a
# human deployed, and the pressure that creates always ends the same way.
#
# `livehost` is the only thing that routes a test between the two. Which tests
# carry it is NOT a convention and NOT a list anyone maintains — it is derived
# from the code and asserted by TestTheShipAndHostGatesCannotDrift in
# tests/test_ops_watchdogs.py, because a hand-maintained list of test names has
# been the hole three times this week.
markers = [
    "livehost: reads the LIVE machine (systemd, /etc/systemd/system). Advisory in the ship gate — printed, never silently dropped — and MANDATORY in the deploy gate.",
]
# A typo'd marker must not quietly select nothing: `-m livehsot` collecting
# zero tests is exactly the silent-absence failure this split exists to avoid.
addopts = "--strict-markers"
