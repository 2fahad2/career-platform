name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres 16 — the same major version as staging/production. The service
    # container's POSTGRES_USER is a superuser and owns the schema; the
    # non-superuser app role (career_app) is created in a step below so RLS
    # actually applies to the application connection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: career_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: career_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_owner -d career_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CAREER_ENV: staging
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: career_test
      DB_OWNER_USER: career_owner
      DB_OWNER_PASSWORD: ci_owner_pw
      DB_USER: career_app
      DB_PASSWORD: ci_app_pw
      # Force the cross-tenant RLS tests to run (never silently skip) — this is
      # the whitepaper §13 C2 exit condition: cross-tenant tests pass in CI.
      CI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create non-superuser app role
        run: python scripts/ci_create_app_role.py

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type-check (mypy)
        run: mypy

      - name: Apply migrations (alembic)
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -q
