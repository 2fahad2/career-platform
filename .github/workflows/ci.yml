name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres 16 — the same major version as staging/production. The service
    # container's POSTGRES_USER is a superuser and owns the schema; the
    # non-superuser app role (career_app) is created in a step below so RLS
    # actually applies to the application connection.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: career_owner
          POSTGRES_PASSWORD: ci_owner_pw
          POSTGRES_DB: career_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_owner -d career_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CAREER_ENV: staging
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: career_test
      DB_OWNER_USER: career_owner
      DB_OWNER_PASSWORD: ci_owner_pw
      DB_USER: career_app
      DB_PASSWORD: ci_app_pw
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # Test-only fake secrets so signature/endpoint tests actually run in CI
      # (they skip when the app's configured secret != the test value).
      SALLA_WEBHOOK_SECRET: test_secret_123
      WHATSAPP_APP_SECRET: wa_app_secret_123
      WHATSAPP_VERIFY_TOKEN: wa_verify_123
      # Force the cross-tenant RLS tests (and the Redis queue test) to actually
      # run — never silently skip. Whitepaper §13 C2 exit condition: cross-tenant
      # tests pass in CI.
      CI_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the lockfile is the contract — CI must test what ships
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Create non-superuser app role
        run: python scripts/ci_create_app_role.py

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type-check (mypy)
        run: mypy

      - name: Type-check live runners (mypy scripts)
        run: mypy scripts/ --explicit-package-bases

      - name: Shellcheck ops scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          # The CV template names Liberation Sans first and DejaVu second, and
          # the Arabic report needs Noto Naskh. Without them the runner
          # rendered every PDF in whatever fallback fontconfig happened to
          # pick — so CI was validating a different document than the one a
          # paying customer receives, and the byte-determinism test passed or
          # failed on font-cache warmth rather than on our code.
          sudo apt-get install -y fonts-liberation fonts-dejavu-core \
            fonts-noto-core fonts-noto-naskh-arabic >/dev/null
          fc-cache -f >/dev/null
          # fail loudly rather than render in a fallback face: a masked
          # install is how CI ended up validating a document the customer
          # never receives
          fc-list | grep -qi liberation || { echo "Liberation missing"; exit 1; }
          fc-list | grep -qi naskh || { echo "Noto Naskh missing"; exit 1; }
          shellcheck ops/backup/*.sh scripts/*.sh

      - name: Dependency lockfile is present and parseable
        run: |
          test -s requirements.lock || { echo "requirements.lock missing"; exit 1; }
          pins=$(grep -cE '^[A-Za-z0-9_.-]+==' requirements.lock)
          echo "pinned packages: $pins"
          test "$pins" -ge 40 || { echo "lockfile looks truncated"; exit 1; }

      - name: Apply migrations (alembic)
        run: alembic upgrade head

      - name: Check migration/model drift (alembic)
        run: alembic check

      - name: Test (pytest)
        run: pytest -q
